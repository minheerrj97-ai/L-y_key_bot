<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Giải Mã Key</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; background-color: #f4f4f9; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); display: inline-block; max-width: 400px; }
        .key-box { font-size: 22px; font-weight: bold; color: #e74c3c; background: #fdf2f2; border: 2px dashed #e74c3c; padding: 10px; margin: 20px 0; border-radius: 5px; word-break: break-all; }
        button { background: #3498db; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; }
        button:hover { background: #2980b9; }
    </style>
</head>
<body>

<div class="card">
    <h2>🎉 VƯỢT LINK THÀNH CÔNG!</h2>
    <p>Mã Key kích hoạt độc quyền cho tài khoản của bạn là:</p>
    <div class="key-box" id="keyDisplay">Đang tạo...</div>
    <button onclick="copyKey()">⚠ Sao Chép Mã Key</button>
    <p style="margin-top: 20px; font-size: 14px; color: #555;">
        👉 Hãy copy mã trên, quay lại Bot và gõ cú pháp:<br>
        <code style="background: #eee; padding: 2px 6px; border-radius: 3px; font-weight: bold;">/key MÃ_SỐ</code>
    </p>
</div>

<script>
    // Hàm lấy tham số từ URL
    function getQueryParam(param) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(param);
    }

    // Thuật toán mã hóa đơn giản để biến đổi User ID Telegram thành một chuỗi Key bảo mật
    function generateSecureKey(uid) {
        if (!uid) return "KHONG_TIM_THAY_ID";
        // Mã hóa cơ bản bằng Base64 chuỗi định dạng để tránh user tự đoán key
        const salt = "M4_SECRET_2026";
        return btoa(uid + "_" + salt).replace(/=/g, "").toUpperCase();
    }

    const uid = getQueryParam('uid');
    const generatedKey = generateSecureKey(uid);
    document.getElementById('keyDisplay').innerText = generatedKey;

    function copyKey() {
        navigator.clipboard.writeText(generatedKey);
        alert("✅ Đã sao chép mã Key thành công!");
    }
</script>
</body>
</html>
